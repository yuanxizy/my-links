<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>端点星工作室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 16px;
            font-size: 1.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .add-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
            z-index: 100;
        }

        .add-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
        }

        .add-btn svg {
            width: 28px;
            height: 28px;
            stroke: white;
            stroke-width: 3;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 18px;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            padding: 0;
            line-height: 1;
        }

        .close-btn:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="url"] {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-input-wrapper {
            position: relative;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border: 2px dashed #667eea;
            border-radius: 10px;
            cursor: pointer;
            color: #667eea;
            font-weight: 500;
            font-size: 14px;
            transition: background 0.3s;
        }

        .file-input-label:hover {
            background: rgba(102, 126, 234, 0.05);
        }

        .selected-file {
            margin-top: 8px;
            padding: 8px 12px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
            display: none;
        }

        .selected-file.show {
            display: block;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
            color: #999;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e1e1e1;
        }

        .divider span {
            padding: 0 12px;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .link-item:hover {
            transform: translateX(4px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }

        .link-info {
            flex: 1;
            min-width: 0;
        }

        .link-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .link-url {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .link-time {
            font-size: 11px;
            color: #bbb;
            white-space: nowrap;
        }

        .link-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: 500;
        }

        .link-badge.external {
            background: #e3f2fd;
            color: #1565c0;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            padding: 6px;
            font-size: 16px;
            transition: color 0.3s;
        }

        .delete-btn:hover {
            color: #f44336;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.8);
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state p {
            font-size: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.8);
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 1.4em;
            }

            .link-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .link-meta {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>&#128279; 我的链接</h1>

        <div id="linkList" class="link-list">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <button class="add-btn" id="openModal">
        <svg viewBox="0 0 24 24" fill="none">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
    </button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>添加链接</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>

            <div class="form-group">
                <label for="title">标题</label>
                <input type="text" id="title" placeholder="输入链接标题">
            </div>

            <div class="form-group">
                <label for="url">链接地址</label>
                <input type="url" id="url" placeholder="https://example.com">
            </div>

            <div class="divider">
                <span>或者上传本地文件</span>
            </div>

            <div class="form-group">
                <div class="file-input-wrapper">
                    <input type="file" id="file" accept="*/*">
                    <label for="file" class="file-input-label">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                        </svg>
                        选择文件
                    </label>
                </div>
                <div id="selectedFileName" class="selected-file"></div>
            </div>

            <button class="btn btn-primary" id="addBtn">
                添加
            </button>
        </div>
    </div>

    <script>
        var titleInput = document.getElementById('title');
        var urlInput = document.getElementById('url');
        var fileInput = document.getElementById('file');
        var selectedFileName = document.getElementById('selectedFileName');
        var addBtn = document.getElementById('addBtn');
        var linkList = document.getElementById('linkList');
        var openModalBtn = document.getElementById('openModal');
        var closeModalBtn = document.getElementById('closeModal');
        var modalOverlay = document.getElementById('modalOverlay');

        var links = [];

        function loadLinks() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/links', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            links = JSON.parse(xhr.responseText);
                        } catch (e) {
                            links = [];
                        }
                        renderLinks();
                    } else {
                        linkList.innerHTML = '<div class="empty-state"><p>加载失败，请刷新重试</p></div>';
                    }
                }
            };
            xhr.send();
        }

        function formatTime(timestamp) {
            var date = new Date(timestamp);
            var month = date.getMonth() + 1;
            var day = date.getDate();
            var hours = String(date.getHours()).padStart(2, '0');
            var minutes = String(date.getMinutes()).padStart(2, '0');
            return month + '/' + day + ' ' + hours + ':' + minutes;
        }

        function renderLinks() {
            if (links.length === 0) {
                linkList.innerHTML = '<div class="empty-state">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
                    '<path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>' +
                    '<p>还没有添加任何链接</p>' +
                    '<p style="font-size: 13px; margin-top: 8px; opacity: 0.7;">点击右下角 + 添加第一个链接</p>' +
                    '</div>';
                return;
            }

            var sortedLinks = links.slice().sort(function(a, b) {
                return b.createdAt - a.createdAt;
            });

            var html = '';
            for (var i = 0; i < sortedLinks.length; i++) {
                var link = sortedLinks[i];
                var badge = link.type === 'file' ? '&#128193;' : '&#127760;';
                html += '<div class="link-item" data-id="' + link.id + '">' +
                    '<div class="link-info">' +
                    '<div class="link-title">' + escapeHtml(link.title) + '</div>' +
                    '<div class="link-url">' + escapeHtml(link.displayUrl) + '</div>' +
                    '</div>' +
                    '<div class="link-meta">' +
                    '<span class="link-badge ' + (link.type === 'file' ? '' : 'external') + '">' + badge + '</span>' +
                    '<span class="link-time">' + formatTime(link.createdAt) + '</span>' +
                    '<button class="delete-btn" data-id="' + link.id + '" title="删除">&#128465;</button>' +
                    '</div></div>';
            }
            linkList.innerHTML = html;
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function deleteLink(id) {
            var xhr = new XMLHttpRequest();
            xhr.open('DELETE', '/api/links/' + id, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    links = links.filter(function(link) {
                        return link.id !== id;
                    });
                    renderLinks();
                }
            };
            xhr.send();
        }

        function openModal() {
            modalOverlay.classList.add('show');
            titleInput.focus();
        }

        function closeModal() {
            modalOverlay.classList.remove('show');
            titleInput.value = '';
            urlInput.value = '';
            fileInput.value = '';
            selectedFileName.classList.remove('show');
            selectedFileName.textContent = '';
            addBtn.disabled = false;
            addBtn.textContent = '添加';
        }

        function handleAddLink() {
            var title = titleInput.value.trim();
            var urlValue = urlInput.value.trim();
            var file = fileInput.files[0];

            if (!title) {
                alert('请输入标题');
                titleInput.focus();
                return;
            }

            addBtn.disabled = true;
            addBtn.textContent = '上传中...';

            if (file) {
                var formData = new FormData();
                formData.append('file', file);

                var uploadXhr = new XMLHttpRequest();
                uploadXhr.open('POST', '/api/upload', true);
                uploadXhr.onreadystatechange = function() {
                    if (uploadXhr.readyState === 4) {
                        if (uploadXhr.status === 200) {
                            try {
                                var uploadData = JSON.parse(uploadXhr.responseText);
                                saveLink(title, uploadData.url, uploadData.filename, 'file');
                            } catch (e) {
                                alert('上传失败');
                                addBtn.disabled = false;
                                addBtn.textContent = '添加';
                            }
                        } else {
                            alert('上传失败');
                            addBtn.disabled = false;
                            addBtn.textContent = '添加';
                        }
                    }
                };
                uploadXhr.send(formData);
            } else if (urlValue) {
                if (!urlValue.match(/^https?:\/\//)) {
                    urlValue = 'https://' + urlValue;
                }
                saveLink(title, urlValue, urlValue, 'external');
            } else {
                alert('请输入链接地址或选择文件');
                addBtn.disabled = false;
                addBtn.textContent = '添加';
            }
        }

        function saveLink(title, url, displayUrl, type) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/links', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var newLink = JSON.parse(xhr.responseText);
                            links.unshift(newLink);
                            renderLinks();
                            closeModal();
                        } catch (e) {
                            alert('保存失败');
                        }
                    }
                    addBtn.disabled = false;
                    addBtn.textContent = '添加';
                }
            };
            xhr.send(JSON.stringify({
                title: title,
                url: url,
                displayUrl: displayUrl,
                type: type
            }));
        }

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                selectedFileName.textContent = '已选择: ' + fileInput.files[0].name;
                selectedFileName.classList.add('show');
            } else {
                selectedFileName.classList.remove('show');
            }
        });

        openModalBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);

        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modalOverlay.classList.contains('show')) {
                closeModal();
            }
        });

        linkList.addEventListener('click', function(e) {
            var deleteBtn = e.target.closest('.delete-btn');
            if (deleteBtn) {
                e.stopPropagation();
                var id = deleteBtn.dataset.id;
                if (confirm('确定要删除这个链接吗？')) {
                    deleteLink(id);
                }
                return;
            }

            var linkItem = e.target.closest('.link-item');
            if (linkItem) {
                var id = linkItem.dataset.id;
                for (var i = 0; i < links.length; i++) {
                    if (links[i].id === id) {
                        window.open(links[i].url, '_blank');
                        break;
                    }
                }
            }
        });

        addBtn.addEventListener('click', handleAddLink);

        titleInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') urlInput.focus();
        });

        urlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleAddLink();
        });

        loadLinks();
    </script>
</body>
</html>
